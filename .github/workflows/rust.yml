name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vulkan-tutorial

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2.9.2

    - name: Install Vulkan SDK (loader + validation layers)
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev glslc
    
    - name: Build
      run: cargo build --verbose

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings -A clippy::too_many_arguments
      
    - name: Run tests
      run: cargo test --verbose
